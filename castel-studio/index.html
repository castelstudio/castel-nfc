<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CASTEL STUDIO | Tarjeta Digital</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #09090d;
      color: white;
      display: flex;
      justify-content: center;
    }

    .tarjeta {
      width: 100%;
      max-width: 430px;
      padding: 45px 25px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitulo {
      color: #bcbccc;
      font-size: 14px;
      margin-bottom: 35px;
    }

    .foto {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #7b2cff, #d946ef, #168cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: bold;
    }

    h1 {
      font-size: 26px;
      margin: 0 0 8px;
    }

    .descripcion {
      color: #c7c7d0;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 14px 0;
      border-radius: 14px;
      background: #17171f;
      color: white;
      text-decoration: none;
      border: 1px solid #343443;
      font-size: 16px;
      transition: 0.2s;
    }

    .boton:hover {
      background: #242430;
      transform: translateY(-2px);
    }

    .whatsapp {
      border-color: #555;
    }

    .instagram {
      border-color: #555;
    }

    .facebook {
      border-color: #555;
    }

    .tiktok {
      border-color: #555;
    }

    .web {
      border-color: #555;
    }

    .footer {
      margin-top: 40px;
      color: #777783;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="tarjeta">

    <div class="logo">CASTEL STUDIO</div>

    <div class="subtitulo">
      Marketing · Diseño · Presencia Digital
    </div>

    <div class="foto">
      CS
    </div>

    <h1>Dolores Mendoza</h1>

    <p class="descripcion">
      Ayudamos a negocios a destacar, conectar con sus clientes
      y tener una presencia digital profesional.
    </p>

    <a
      class="boton whatsapp"
      href="https://wa.me/524622122209?text=Hola%2C%20quiero%20armar%20mi%20paquete%20por%20d%C3%ADas%20y%20me%20gustar%C3%ADa%20conocer%20las%20opciones%20disponibles."
      target="_blank">
      💬 WhatsApp
    </a>

    <a
      class="boton instagram"
      href="https://www.instagram.com/castel_studio.mx?stkn=djNseTh3MHVyNmgx&utm_source=qr"
      target="_blank">
      📸 Instagram
    </a>

    <a
      class="boton facebook"
      href="https://www.facebook.com/share/19eoHnH3Rr/?mibextid=wwXIfr"
      target="_blank">
      📘 Facebook
    </a>

    <a
      class="boton tiktok"
      href="https://www.tiktok.com/@castel_studio.mx?_r=1&_t=ZS-9AE9bu5EYGC"
      target="_blank">
      🎵 TikTok
    </a>

    <a
      class="boton web"
      href="https://castelstudiomx.netlify.app"
      target="_blank">
      🌐 Página web
    </a>

    <div class="footer">
      CASTEL STUDIO · Tarjeta Digital
    </div>

  </div>

</body>
</html>
