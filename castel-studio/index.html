  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #171d3d 0%, #09090d 45%, #050507 100%);
      color: white;
      display: flex;
      justify-content: center;
    }
    .tarjeta {
      width: 100%;

      padding: 40px 24px 30px;
      text-align: center;
    }
    .logo-img {
      width: 155px;
      height: 155px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
      filter: drop-shadow(0 0 18px rgba(30, 100, 255, 0.35));
    }
    .nombre-marca {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;

    .subtitulo {

      font-size: 13px;
      margin-bottom: 34px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 27px;
      margin: 0 0 8px;
    }
    .puesto {
      color: #5d91ff;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 18px;
    }
    .descripcion {
      color: #c7c7d0;
      line-height: 1.55;
      margin: 0 auto 30px;
      max-width: 360px;
      font-size: 14px;
    }
    .boton {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 13px 0;
      border-radius: 15px;
      background: rgba(23, 23, 31, 0.94);
      color: white;
      text-decoration: none;
      border: 1px solid #343443;
      font-size: 16px;
      font-weight: 500;
      transition: 0.2s;
    }
    .boton:hover {
      background: #242430;
      transform: translateY(-2px);
    }
    .whatsapp {
      border-color: #3f5b48;
    }
    .instagram {
      border-color: #59405f;
    }
    .facebook {
      border-color: #3e4f6e;
    }
    .tiktok {
      border-color: #41414c;
    }
    .web {
      border-color: #3e536e;
    }
    .footer {
      margin-top: 38px;
      color: #777783;
      font-size: 12px;
    }
